<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ data.title }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 30px;
        }

        .back-link {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        /* Стили для большой картинки */
        .big-image-wrapper {
            width: 100%;
        }

        .big-image {
            display: block;
            width: 100%;
            height: auto;
            min-height: 800px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #eee;
        }

        /* Блок с формой по центру */
        .form-section {
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 500px;
            margin: 40px auto;
        }

        .quantity-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        label {
            font-size: 1.1rem;
            color: #555;
        }

        input[type="number"] {
            width: 80px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            font-size: 1.1rem;
        }

        .add-to-cart-btn {
            display: inline-block;
            padding: 18px 50px;
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            border: none;
            cursor: pointer;
        }

        .add-to-cart-btn:hover {
            background-color: #c0392b;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.5);
        }

        .cart-link-row {
            text-align: center;
            margin-top: 25px;
        }

        .cart-link {
            color: #3498db;
            text-decoration: underline;
            font-weight: 600;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header class="container">
        <a href="/" class="back-link">← Вернуться на главную</a>
    </header>

    <main class="container">
        <h1>{{ data.title }}</h1>

        <!-- Большая картинка 1 -->
        <div class="big-image-wrapper">
            <img src="{{ url_for('static', filename=data.image_1) }}" 
                 alt="{{ data.title }}" 
                 class="big-image"
                 onerror="this.src='https://via.placeholder.com/1200x900?text=Кровельные+ограждения'">
        </div>

        <!-- Большая картинка 2 -->
        <div class="big-image-wrapper" style="margin-top: 30px;">
            <img src="{{ url_for('static', filename=data.image_2) }}" 
                 alt="{{ data.title }}" 
                 class="big-image"
                 onerror="this.src='https://via.placeholder.com/1200x900?text=Ещё+одна+картинка'">
        </div>

        <!-- Форма добавления в корзину (вместо простой кнопки) -->
        <form action="/fence/add-to-cart" method="POST" class="form-section">
            <div class="quantity-row">
                <label for="quantity">Кол-во комплектов:</label>
                <input type="number" id="quantity" name="quantity" value="1" min="1" required>
            </div>
            <button type="submit" class="add-to-cart-btn">Добавить к заказу</button>
        </form>

        <!-- Ссылка на корзину -->
        <div class="cart-link-row">
            <a href="/snow_guard/cart" class="cart-link">Перейти в корзину и оформить заявку</a>
        </div>
    </main>

</body>
</html>
