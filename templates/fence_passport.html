<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ item.title }}</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { padding: 20px 0; border-bottom: 1px solid #ddd; margin-bottom: 30px; }
        .back-link { color: #3498db; text-decoration: none; font-weight: 600; }

        .passport {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 30px;
        }

        .passport-layout {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .passport-image-wrapper {
            flex: 1 1 400px;
            min-width: 300px;
        }

        .passport-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #eee;
            object-fit: cover;
        }

        .passport-info {
            flex: 1 1 300px;
            min-width: 280px;
        }

        h1 { color: #2c3e50; margin-top: 0; }
        .passport-code { color: #999; font-size: 0.95rem; margin-bottom: 10px; }
        .passport-desc { color: #555; line-height: 1.6; font-size: 1.05rem; }
        .passport-price { font-size: 1.8rem; color: #e74c3c; font-weight: bold; margin: 25px 0; }

        .form-section {
            text-align: center;
            padding: 30px 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 500px;
            margin: 40px auto;
        }

        .quantity-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        label { font-size: 1.1rem; color: #555; }

        input[type="number"] {
            width: 80px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            font-size: 1.1rem;
        }

        .add-to-cart-btn {
            display: inline-block;
            padding: 18px 50px;
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            border: none;
            cursor: pointer;
        }

        .add-to-cart-btn:hover {
            background-color: #c0392b;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.5);
        }

        .cart-link-row { text-align: center; margin-top: 25px; }
        .cart-link { color: #3498db; text-decoration: underline; font-weight: 600; font-size: 1rem; }
    </style>
</head>
<body>

    <header class="container">
        <a href="/fence" class="back-link">← Вернуться в каталог ограждений</a>
    </header>

    <main class="container">
        <div class="passport">
            <div class="passport-layout">
                <div class="passport-image-wrapper">
                    <img src="{{ url_for('static', filename=item.image) }}"
                         alt="{{ item.title }}"
                         class="passport-image"
                         onerror="this.src='https://via.placeholder.com/800x600?text=Ограждение'">
                </div>
                <div class="passport-info">
                    <p class="passport-code">Артикул: {{ code }}</p>
                    <h1>{{ item.title }}</h1>
                    <p class="passport-desc">{{ item.description }}</p>
                    <p class="passport-price">{{ item.price }} ₽ / комплект</p>
                </div>
            </div>
        </div>

        <form action="/fence/add-to-cart" method="POST" class="form-section">
            <input type="hidden" name="code" value="{{ code }}">
            <div class="quantity-row">
                <label for="quantity">Кол-во комплектов:</label>
                <input type="number" id="quantity" name="quantity" value="1" min="1" required>
            </div>
            <button type="submit" class="add-to-cart-btn">Добавить к заказу</button>
        </form>

        <div class="cart-link-row">
            <a href="/snow_guard/cart" class="cart-link">Перейти в корзину и оформить заявку</a>
        </div>
    </main>

</body>
</html>
