<style>
    .site-nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(44, 62, 80, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 8px 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .site-nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 20px;
        color: #ecf0f1;
        background: rgba(255,255,255,0.08);
        text-decoration: none;
        border-radius: 50px;
        font-weight: 600;
        font-size: 0.95rem;
        border: 1px solid rgba(255,255,255,0.12);
        cursor: pointer;
        font-family: inherit;
        transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    }

    .site-nav-btn:hover {
        background: rgba(231, 76, 60, 0.9);
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(231, 76, 60, 0.35);
    }

    .site-nav-btn:active {
        transform: translateY(0) scale(0.96);
    }

    .site-nav-btn.nav-home {
        background: rgba(52, 152, 219, 0.85);
    }

    .site-nav-btn.nav-home:hover {
        background: #2980b9;
        box-shadow: 0 6px 16px rgba(41, 128, 185, 0.4);
    }

    .site-nav-btn.nav-cart {
        background: rgba(230, 126, 34, 0.9);
        margin-left: auto;
        position: relative;
    }

    .site-nav-btn.nav-cart:hover {
        background: #d35400;
        box-shadow: 0 6px 16px rgba(211, 84, 0, 0.4);
    }

    .cart-badge {
        display: inline-block;
        min-width: 22px;
        padding: 2px 6px;
        background: #fff;
        color: #d35400;
        border-radius: 50px;
        font-size: 0.8rem;
        font-weight: 700;
        text-align: center;
    }

    .cart-toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 200;
        background: #2c3e50;
        color: #fff;
        padding: 14px 22px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        font-weight: 600;
        font-size: 0.95rem;
        opacity: 0;
        transform: translateY(15px);
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .cart-toast.show {
        opacity: 1;
        transform: translateY(0);
    }
    .cart-toast.error {
        background: #c0392b;
    }

    @media (max-width: 600px) {
        .site-nav { padding: 6px 12px; gap: 6px; }
        .site-nav-btn { padding: 8px 14px; font-size: 0.85rem; }
        .site-nav-btn .nav-label { display: none; }
        .cart-toast { left: 20px; right: 20px; text-align: center; }
    }
</style>

<nav class="site-nav">
    <button class="site-nav-btn" onclick="history.back(); return false;">
        <span>←</span><span class="nav-label">Назад</span>
    </button>
    <a href="/" class="site-nav-btn nav-home">
        <span>🏠</span><span class="nav-label">Домой</span>
    </a>
    <a href="/snow_guard/cart" class="site-nav-btn nav-cart" id="cart-btn">
        <span>🛒</span><span class="nav-label">Корзина</span>
        {% if session.get('cart') %}
        <span class="cart-badge" id="cart-badge">{{ session.cart|length }}</span>
        {% endif %}
    </a>
</nav>

<div class="cart-toast" id="cart-toast"></div>

<script>
function showToast(text, isError) {
    const toast = document.getElementById('cart-toast');
    if (!toast) return;
    toast.textContent = text;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function() {
        toast.classList.remove('show');
    }, 2500);
}

function updateBadge(count) {
    const btn = document.getElementById('cart-btn');
    if (!btn) return;
    let badge = document.getElementById('cart-badge');
    if (count === 0) {
        if (badge) badge.remove();
        return;
    }
    if (!badge) {
        badge = document.createElement('span');
        badge.className = 'cart-badge';
        badge.id = 'cart-badge';
        btn.appendChild(badge);
    }
    badge.textContent = count;
    badge.style.transform = 'scale(1.4)';
    setTimeout(function() { badge.style.transform = ''; }, 200);
}

document.addEventListener('submit', async function(e) {
    const form = e.target;
    if (!form.classList.contains('js-cart-form')) return;
    e.preventDefault();

    const data = new FormData(form);
    data.set('ajax', '1');

    const btn = form.querySelector('button[type="submit"]');
    if (btn) btn.disabled = true;

    try {
        const resp = await fetch(form.action, { method: 'POST', body: data });
        const result = await resp.json();
        if (result.ok) {
            updateBadge(result.cart_count);
            showToast('«' + result.name + '» добавлен в корзину');
            const q = form.querySelector('input[type="number"]');
            if (q) q.value = 1;
        } else {
            showToast('Не удалось добавить товар', true);
        }
    } catch (err) {
        form.submit();
    } finally {
        if (btn) btn.disabled = false;
    }
});
</script>
