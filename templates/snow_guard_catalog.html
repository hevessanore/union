<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Снегозадержатели — ООО Юнион</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: cardIn 0.5s ease backwards;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-card:nth-child(1) { animation-delay: 0.05s; }
        .product-card:nth-child(2) { animation-delay: 0.15s; }
        .product-card:nth-child(3) { animation-delay: 0.25s; }
        .product-card:nth-child(4) { animation-delay: 0.35s; }
        .product-card:nth-child(5) { animation-delay: 0.45s; }
        .product-card:nth-child(6) { animation-delay: 0.55s; }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .card-image-wrapper { width: 100%; height: 240px; overflow: hidden; }
        .card-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #eee;
            transition: transform 0.5s ease;
        }
        .product-card:hover .card-image { transform: scale(1.08); }

        .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.2rem; color: #2c3e50; margin: 0 0 10px 0; }
        .card-price { font-size: 1.4rem; color: #e74c3c; font-weight: bold; margin: 15px 0; }

        .card-btn {
            margin-top: auto;
            padding: 14px;
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s ease, box-shadow 0.3s ease;
        }
        .card-btn:hover {
            background-color: #c0392b;
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        .card-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>
    {% include 'nav.html' %}

    <main class="container">
        <h1>Снегозадержатели</h1>

        <div class="catalog-grid">
            {% for code, item in items.items() %}
            <div class="product-card">
                <div class="card-image-wrapper">
                    <img src="{{ url_for('static', filename=item['image']) }}"
                         alt="{{ item['title'] }}"
                         class="card-image"
                         onerror="this.src='https://via.placeholder.com/400x300?text=Снегозадержатель'">
                </div>
                <div class="card-body">
                    <h3 class="card-title">{{ item['title'] }}</h3>
                    <p class="card-price">{{ item['price'] }} ₽</p>
                    <a href="/snow_guard/{{ code }}" class="card-btn">Подробнее</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
